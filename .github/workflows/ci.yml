name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Regenerates code and manifests, formats, vets and runs the tests
      # (including the envtest ones), then fails if that changed any file.
      - run: make test
      - name: Generated files and formatting are up to date
        run: git diff --exit-code
      - name: Default kustomization renders
        run: make build-manifests > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
