apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - command:
        - /manager
        args:
        - --enable-leader-election
        # Metrics are served over HTTPS and need a token allowed to GET /metrics
        # (see config/rbac/auth_proxy_client_clusterrole.yaml).
        - --metrics-addr=:8443
        - --metrics-cert-dir=/etc/metrics-certs
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8443
          name: https
        volumeMounts:
        - name: metrics-certs
          mountPath: /etc/metrics-certs
          readOnly: true
        resources:
          # Baseline for a small test cluster (52-55 MiB measured resident).
          # Tune memory for your cluster size and workload.
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: metrics-certs
        secret:
          secretName: metrics-server-cert
      terminationGracePeriodSeconds: 10
